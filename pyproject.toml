[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enviropermit-kbs"
version = "0.1.0"
description = "Scoped OWL 2 DL and SWRL reasoning foundation"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic==2.11.7"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
enviropermit = "enviropermit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

